<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FundFlow — Recent Transactions</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div data-include="components/navbar.html"></div>
  <main class="page container">
    <section class="card">
      <div class="section-heading">
        <div>
          <h2>Recent Transactions</h2>
          <p class="muted">All your recent activity — deposits, withdrawals, VIP, referrals and wallet movements.</p>
        </div>
      </div>

      <div class="filter-row" style="display:flex; gap:8px; margin:12px 0; overflow:auto;">
        <button class="btn small filter-btn active" data-filter="all">All</button>
        <button class="btn small filter-btn" data-filter="deposit">Deposits</button>
        <button class="btn small filter-btn" data-filter="withdrawal">Withdrawals</button>
        <button class="btn small filter-btn" data-filter="vip">VIP</button>
        <button class="btn small filter-btn" data-filter="referral">Referral</button>
        <button class="btn small filter-btn" data-filter="wallet">Wallet</button>
      </div>

      <div id="transactions-container" class="transactions-list" style="min-height:200px;"></div>
    </section>
  </main>

  <div id="transaction-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <button class="modal-close" id="transaction-modal-close">×</button>
      <div id="transaction-modal-content"></div>
    </div>
  </div>

  <div data-include="components/footer.html"></div>
  <script src="js/app.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/transactions.js"></script>
</body>
</html>
