<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FundFlow — Create Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div data-include="components/navbar.html"></div>
  <main class="page container">
    <section class="card auth-card">
      <h2>Create Account</h2>
      <form id="register-form">
        <label>Full Name<input type="text" id="fullName" required></label>
        <label>Phone Number<input type="text" id="phone" required placeholder="08012345678"></label>
        <label>Password<input type="password" id="password" required></label>
        <label>Referral Code (optional)<input type="text" id="referralCode" placeholder="Enter a referral code or leave blank"></label>
        <button class="btn primary" type="submit">Register</button>
      </form>
      <p class="muted">Already have an account? <a href="login.html">Login</a></p>
    </section>
  </main>
  <div data-include="components/footer.html"></div>
  <script src="js/app.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
