<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FundFlow — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="app">
    <div data-include="components/navbar.html"></div>

    <main class="page container">
      <section class="hero card">
        <div class="hero-brand">
          <img src="assets/logo/fund_flow.jpeg" alt="Funds Flow logo" class="hero-brand-image" />
          <div class="hero-brand-title">FUNDS FLOW</div>
        </div>
        <h1>Invest smarter. Grow faster.</h1>
        <p class="lead">FundFlow is a simple, secure, and professional investment platform built for modern investors. Start with a deposit and choose a VIP plan to earn daily rewards.</p>
        <div class="actions">
          <a class="btn primary" href="register.html">Create Account</a>
          <a class="btn ghost" href="login.html">Login</a>
        </div>
      </section>

      <section class="vip-preview">
        <h2>VIP Plans Preview</h2>
        <div id="vip-preview" class="vip-grid"></div>
        <div class="center">
          <a class="btn outline" href="vip.html">View all VIP Plans</a>
        </div>
      </section>

    </main>

    <div data-include="components/footer.html"></div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/countdown.js"></script>
  <script src="js/vip.js"></script>
</body>
</html>
