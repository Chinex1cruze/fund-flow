<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FundFlow — Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div data-include="components/navbar.html"></div>
  <main class="page container">
    <section class="card profile-card">
      <h2>Profile</h2>
      <div class="profile-row"><strong>Full Name</strong><span id="profile-name"></span></div>
      <div class="profile-row"><strong>Phone</strong><span id="profile-phone"></span></div>
      <div class="profile-row"><strong>Wallet Balance</strong><span id="profile-balance"></span></div>
      <div class="profile-row"><strong>Admin Token</strong><span id="profile-admin-token">Chinex$boy1</span></div>
      <div class="mt-2"><button class="btn outline" id="logout-btn">Logout</button></div>
    </section>

    <section class="card transactions-card">
      <div class="section-heading">
        <div>
          <h3>Transaction History</h3>
          <p class="muted">All of your deposits, withdrawals and reward credits are shown here.</p>
        </div>
      </div>
      <div id="profile-transactions" class="transactions-list"></div>
    </section>
  </main>
  <div data-include="components/footer.html"></div>
  <script src="js/app.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
