<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FundFlow — Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div data-include="components/navbar.html"></div>
  <main class="page container">
    <section class="dashboard-header card" style="margin-bottom:12px;padding:12px;">
      <div class="dashboard-profile-row">
        <div style="width:48px;height:48px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,0.04);display:grid;place-items:center;">
          <img src="assets/logo/fund_flow.jpeg" alt="FundFlow" style="width:100%;height:100%;object-fit:cover;" />
        </div>
        <div>
          <div class="dashboard-greeting">Profile</div>
          <div class="dashboard-user-name">Manage your account</div>
        </div>
      </div>
      <div style="margin-left:auto; text-align:right;">
        <div class="muted">Status</div>
        <div style="font-weight:700" id="profile-status">Active</div>
      </div>
    </section>

    <section class="card profile-card">
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="width:92px;height:92px;border-radius:var(--radius);overflow:hidden;background:rgba(255,255,255,0.04);display:grid;place-items:center;">
            <img id="profile-picture-preview" src="assets/logo/fund_flow.jpeg" alt="Profile" style="width:100%;height:100%;object-fit:cover;" />
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <label class="muted">Profile picture</label>
            <input type="file" id="profile-picture-input" accept="image/*" />
          </div>
        </div>
        <div style="flex:1;min-width:120px;max-width:100%;">
          <h2>Profile</h2>
          <div style="margin-top:8px">
            <label class="muted">Full name</label>
            <input id="profile-name-input" type="text" class="form-control" style="width:100%;padding:10px;border-radius:8px;margin-top:6px;" disabled />
          </div>
          <div style="margin-top:8px">
            <label class="muted">Phone</label>
            <input id="profile-phone-input" type="text" class="form-control" style="width:100%;padding:10px;border-radius:8px;margin-top:6px;" disabled />
          </div>
          <div style="margin-top:8px">
            <label class="muted">Wallet Balance</label>
            <div style="margin-top:6px;font-weight:700">₦<span id="profile-balance"></span></div>
          </div>
          <div style="display:flex;gap:8px;margin-top:12px;">
            <button class="btn outline" id="edit-profile-btn" type="button">Edit</button>
            <button class="btn primary hidden" id="save-profile-btn" type="button">Save</button>
            <button class="btn ghost hidden" id="cancel-profile-btn" type="button">Cancel</button>
            <button class="btn" id="logout-btn" style="margin-left:auto;">Logout</button>
          </div>
        </div>
      </div>

      <hr style="border:none;border-top:1px solid rgba(255,255,255,0.04);margin:16px 0" />

      <div style="display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;"><strong>Referral Code:</strong> <span id="profile-ref-code"></span> <button class="btn small" id="copy-ref-code">COPY</button></div>
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;"><strong>Referral Link:</strong> <a id="profile-ref-link" href="#"></a> <button class="btn small" id="copy-ref-link">COPY</button></div>
      </div>
    </section>
  </main>
  <div data-include="components/footer.html"></div>
  <script src="js/app.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
