<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FundFlow — Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div data-include="components/navbar.html"></div>
  <main class="page container">
    <section class="card profile-card">
      <h2>Profile</h2>
      <div><strong>Full Name:</strong> <span id="profile-name"></span></div>
      <div><strong>Phone:</strong> <span id="profile-phone"></span></div>
      <div><strong>Wallet Balance:</strong> ₦<span id="profile-balance"></span></div>
      <div style="display:flex; align-items:center; gap:8px;"><strong>Referral Code:</strong> <span id="profile-ref-code"></span> <button class="btn small" id="copy-ref-code">COPY</button></div>
      <div style="display:flex; align-items:center; gap:8px;"><strong>Referral Link:</strong> <a id="profile-ref-link" href="#"></a> <button class="btn small" id="copy-ref-link">COPY</button></div>
      <div class="mt-2"><button class="btn outline" id="logout-btn">Logout</button></div>
    </section>
  </main>
  <div data-include="components/footer.html"></div>
  <script src="js/app.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
